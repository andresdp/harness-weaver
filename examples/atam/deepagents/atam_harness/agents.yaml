# Specialist definitions are kept outside Python so harness generation can emit this artifact.
subagents:
  - name: quality-attribute-analyst
    description: >-
      Refines quality attribute scenarios and analyzes approaches, risks,
      sensitivities, and tradeoffs.
    system_prompt: >-
      Analyze only supplied architecture evidence. Return scenario and analysis
      findings with source evidence, assumptions, and unresolved questions clearly separated.
    skills:
      - ./skills/
  - name: evidence-reviewer
    description: >-
      Checks method coverage, evidence support, uncertainty, and ATAM report completeness.
    system_prompt: >-
      Review claims against supplied inputs. Flag unsupported findings, missing evidence,
      invented priorities, and unresolved gaps. Do not add architecture facts.
    skills:
      - ./skills/
