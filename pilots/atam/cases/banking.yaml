# Case binding for the ArchEval banking ATAM case. Paths are relative to this directory.
case: banking
description: ArchEval ATAM banking case study (case-studies/architecture-eval/ATAM/data/banking.json)
generation_inputs:            # copied into an execution sandbox's input/
  - id: architecture-context
    from: ../../../case-studies/architecture-eval/ATAM/data/banking.json
    select: ATAM_Evaluation.evaluation_inputs   # written to input/<id>.json, wrapped back into its envelope
evaluator_only:               # never copied into a sandbox; read only by `hw check`
  - id: reference-outputs
    from: ../../../case-studies/architecture-eval/ATAM/data/banking.json
    select: ATAM_Evaluation.ground_truth_outputs
checks: [schema, atam-pilot]   # no-reference-leakage always runs
