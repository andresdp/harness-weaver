# Standalone ATAM methodology profile; source-derived method notes are copied below.
id: atam-evaluation-methodology
version: 0.1.0
authority: HarnessWeaver adaptation profile based on the referenced ATAM materials
purpose: Evaluate a supplied software architecture description against its quality attribute drivers and
  produce a structured, evidence-grounded ATAM report. This bounded prototype does not claim to conduct
  a complete stakeholder workshop when stakeholder evidence is unavailable.
activities:
- id: establish-context
  readiness: evaluation_inputs are present
  outputs:
  - system_scope
  - business_drivers
  - architecture_evidence
  - open_questions
- id: build-utility-tree
  readiness: business_drivers are identified; unknown details remain explicit
  outputs:
  - quality_attribute_scenarios
  - scenario_origin_and_source_refs
  - priority_tuples
  - response_measures
- id: identify-approaches
  readiness: architecture_evidence is available
  outputs:
  - architecture_approaches
  - source_evidence
- id: analyze-scenarios
  readiness: scenarios and relevant architecture evidence are available
  outputs:
  - analysis_records
  - risks
  - non_risks
  - sensitivity_points
  - tradeoff_points
- id: synthesize-and-review
  readiness: previous artifacts are present; unresolved gaps are recorded
  outputs:
  - atam_report
  - review_findings
semantic_state:
  fields:
  - name: context_status
    values:
    - missing
    - partial
    - sufficient
    evidence_required: true
  - name: driver_status
    values:
    - missing
    - partial
    - sufficient
    evidence_required: true
  - name: architecture_evidence_status
    values:
    - missing
    - partial
    - sufficient
    evidence_required: true
  - name: scenario_analysis_status
    values:
    - not_started
    - partial
    - reviewed
    evidence_required: true
  - name: report_status
    values:
    - not_started
    - draft
    - reviewed
    evidence_required: true
  shared_gap_fields:
  - description
  - affected_activity
  - missing_evidence
  - resolution_question
  separation: This state records ATAM progress and evidence. Agent scratch work, messages, tool calls,
    checkpoints, and token usage belong to the runtime and are not proof of methodology completion.
evidence_rules:
  basis:
    observed: A claim directly stated by the supplied inputs or a validated upstream artifact.
    inferred: A conclusion derived by reasoning from evidence, including any conclusion drawn from missing or
      absent evidence; state the reasoning and preserve uncertainty.
    assumption: A claim not supported by supplied evidence; record it as a gap and never present it as fact.
  identifiers:
    architecture_evidence: AE-n identifiers only.
    supporting_context: AP-n or BD-n identifiers where the contract permits them.
    gaps: G-stage-n identifiers belong only to gap records and must never appear in evidence_ids or evidence citations.
  measurement: If a scenario lacks a response measure, benchmark, workload, or target, do not claim that a
    performance threshold is met or violated; state the uncertainty and record the missing measure as a gap.
scenario_provenance:
  report_identity: Every utility-tree child and evaluation_results.scenarios entry has a stable ID and the same
    origin record. Analysis records reference that report scenario ID; scenario wording is descriptive and is not an identifier.
  origins:
  - kind: raw_candidate_scenario
    source_scenario_id: Required id copied from evaluation_inputs.raw_candidate_scenarios.
    basis: observed
    source_refs: Non-empty paths into evaluation_inputs; at least one path must identify the matching raw candidate scenario.
  - kind: derived_from_evidence
    source_scenario_id: null
    basis: inferred
    source_refs: Non-empty paths to the supplied evaluation_inputs that support the derivation.
  - kind: derived_from_driver
    source_scenario_id: null
    basis: inferred
    source_refs: Non-empty paths to the supplied evaluation_inputs that support the derivation.
  validation: Every source_ref must resolve against the trusted case evaluation_inputs. References must never point to
    ground_truth_outputs. The utility tree and evaluation_results.scenarios inventories must have matching IDs, text,
    and origins. Every analysis scenario_reference.id must resolve to exactly one reported scenario, and its text must
    match that scenario's scenario_text.
  readiness: Missing, duplicate, dangling, or unresolvable scenario lineage is an evidence_traceability failure and
    blocks ready_for_architect_review.
completion:
  required:
  - context_status
  - driver_status
  - architecture_evidence_status
  - atam_report
  rule: A report may be completed with partial inputs only when every material gap and assumption is identified
    and no unsupported claim is presented as fact.
human_review:
  required_before_decision_use: true
  reviewer: software architect familiar with the evaluated system
  focus:
  - method_coverage
  - evidence_grounding
  - risks
  - tradeoffs
  - unknowns
reference_boundary:
  generation_input: ATAM_Evaluation.evaluation_inputs
  evaluation_only: ATAM_Evaluation.ground_truth_outputs
  rule: Never include evaluation-only reference outputs in generation context.
report_contract:
  ref: atam-report-template.json
  findings_key: ATAM_Evaluation.evaluation_results
  provenance: The report template is derived from the ArchEval ATAM template. It renames ground_truth_outputs
    to evaluation_results so generated findings cannot be confused with the dataset's evaluation-only
    reference answers.
source_basis:
  materials:
  - ArchEval ATAM multi-agent workflow
  - ArchEval ATAM prompt protocol
  - ArchEval ATAM report template
  copied_method_summary:
  - The reference workflow extracts architectural approaches, builds a utility tree, generates scenarios,
    analyzes risks and sensitivities, and writes structured results.
  - The reference prompt protocol assigns Customer, Architect, Manager, and EvaluationTeam roles; supports
    information requests and reviews; and requires JSON outputs conforming to a shared report template.
  - The reference report structure covers architectural approaches, utility tree, scenarios, and analysis
    records with risks, non-risks, sensitivity points, and tradeoff points.
  adaptation: The HarnessWeaver profile adds explicit readiness, evidence and gap tracking, evaluator-only
    reference separation, and human review.
