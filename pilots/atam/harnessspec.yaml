spec_version: "0.1"
id: archeval-atam
domain: software architecture evaluation
workflow:
  id: atam-evaluation
  purpose: Analyze an architecture description using ATAM concepts and produce a structured evaluation report.
sources:
  - id: archeval-workflow
    ref: ../../case-studies/architecture-eval/ATAM/agents/main.py
    kind: workflow-implementation
    authority: ArchEval case study; reference only
    notes: Existing multi-role ATAM workflow. HarnessWeaver does not own this source.
  - id: atam-method-prompts
    ref: ../../case-studies/architecture-eval/ATAM/agents/prompt_manager.py
    kind: domain-guidance
    authority: ArchEval case study; reference only
  - id: atam-methodology
    ref: methodology.yaml
    kind: methodology-and-semantic-state
    authority: HarnessWeaver demo profile, derived from the cited ATAM sources
    notes: Adaptation profile for this bounded demo; not a replacement for the source method.
  - id: harness-design-skill
    ref: ../../harness-en/skills/harness/SKILL.md
    kind: harness-methodology
    authority: HarnessWeaver working-tree skill
roles:
  - id: atam-facilitator
    purpose: Sequence the evaluation, identify missing inputs, and maintain semantic methodology state.
    skill_refs:
      - methodology.yaml
  - id: quality-attribute-analyst
    purpose: Build the utility tree and analyze architecture approaches against prioritized scenarios.
    skill_refs:
      - ../../case-studies/architecture-eval/ATAM/agents/prompt_manager.py
      - methodology.yaml
  - id: evidence-reviewer
    purpose: Check that evaluation claims are traceable to supplied architecture evidence and report unknowns.
    skill_refs:
      - methodology.yaml
stages:
  - id: establish-context
    role: atam-facilitator
    purpose: Establish scope, business drivers, architecture description, constraints, and evidence gaps.
    inputs:
      - ../../case-studies/architecture-eval/ATAM/data/banking.json#ATAM_Evaluation.evaluation_inputs
    outputs: [evaluation-context]
  - id: build-utility-tree
    role: quality-attribute-analyst
    purpose: Refine quality attribute drivers into prioritized, measurable scenarios; retain unresolved items as gaps.
    inputs:
      - ../../case-studies/architecture-eval/ATAM/data/banking.json#ATAM_Evaluation.evaluation_inputs
    outputs: [utility-tree]
  - id: identify-approaches
    role: quality-attribute-analyst
    purpose: Record architecture approaches supported by the supplied description and their evidence.
    inputs:
      - ../../case-studies/architecture-eval/ATAM/data/banking.json#ATAM_Evaluation.evaluation_inputs
    outputs: [architecture-approaches]
  - id: analyze-scenarios
    role: quality-attribute-analyst
    purpose: Analyze prioritized scenarios against documented architecture decisions and response measures.
    inputs:
      - ../../case-studies/architecture-eval/ATAM/data/banking.json#ATAM_Evaluation.evaluation_inputs
    outputs: [analysis-records]
  - id: synthesize-and-review
    role: evidence-reviewer
    purpose: Assemble the ATAM report and check evidence, coverage, uncertainty, and output structure.
    inputs:
      - ../../case-studies/architecture-eval/ATAM/data/banking.json#ATAM_Evaluation.evaluation_inputs
    outputs: [ATAM_Evaluation]
artifacts:
  - id: architecture-context
    kind: structured-case-input
    direction: input
    ref: ../../case-studies/architecture-eval/ATAM/data/banking.json#ATAM_Evaluation.evaluation_inputs
    description: Evaluation inputs only; ground truth is explicitly excluded from generation.
  - id: atam-report
    kind: structured-evaluation
    direction: output
    ref: ATAM_Evaluation
    description: ATAM findings, including utility tree, analysis records, risks, non-risks, sensitivity points, tradeoff points, and prioritized scenarios.
    schema_ref: report-template.json
  - id: evaluation-context
    kind: methodology-state
    direction: intermediate
    ref: evaluation-context.json
    description: Transient structured stage output carried in the runtime context and summarized in the final report; no standalone file is emitted.
  - id: utility-tree
    kind: methodology-artifact
    direction: intermediate
    ref: utility-tree.json
    description: Transient utility-tree output carried in the runtime context and included in the final report; no standalone file is emitted.
  - id: architecture-approaches
    kind: methodology-artifact
    direction: intermediate
    ref: architecture-approaches.json
    description: Transient architecture-approach output carried in the runtime context and included in the final report; no standalone file is emitted.
  - id: analysis-records
    kind: methodology-artifact
    direction: intermediate
    ref: analysis-records.json
    description: Transient analysis output carried in the runtime context and included in the final report; no standalone file is emitted.
verification:
  - id: output-shape
    criterion: Output conforms to the documented ATAM artifact structure.
    method: Deterministic structural validation against the ATAM template and declared required sections.
    artifact: atam-report
  - id: evidence-grounding
    criterion: Findings are supported by the supplied architecture context.
    method: Domain expert review; record separately from structural checks.
    artifact: atam-report
  - id: no-reference-leakage
    criterion: Ground-truth outputs are used only during evaluation and never passed to the generated harness.
    method: Inspect the harness input-selection instructions and backend serialization; where runtime traces are available, verify only evaluation_inputs reaches the model.
    artifact: atam-report
human_gates:
  - id: expert-review
    point: Before accepting the evaluation report as a decision input.
    reason: Architecture judgments and evidence interpretation require qualified human review.
    required_artifacts:
      - atam-report
runtime_requirements:
  - file-based artifact input and output
