[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessweaver"
version = "0.1.0"
description = "Runtime-neutral HarnessSpec loading and validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[project.optional-dependencies]
deepagents = [
    "deepagents>=0.5.2",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-anthropic>=1.0.0",
    "langchain-openai>=1.0.0",
    "rich>=13.9,<15.0",
]

[project.scripts]
hw = "harnessweaver.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
